# Reusable OTT / IPTV DevOps PR gates
# Call from other repos:
#   uses: agupta47tv/ntv-actions-pilot/.github/workflows/reusable-ott-pr-gates.yml@main
name: OTT PR gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks scan
        run: gitleaks detect --source . --verbose --redact

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          mapfile -t scripts < <(find . -name '*.sh' -not -path './.git/*')
          if ((${#scripts[@]})); then shellcheck --severity=warning "${scripts[@]}"; else echo "No shell scripts"; fi

  bash-syntax:
    name: Bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mapfile -t scripts < <(find . -name '*.sh' -not -path './.git/*')
          for f in "${scripts[@]}"; do bash -n "$f"; done
