name: CI

on:
  push:
    branches: [main, master, 'pilot/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run gitleaks CLI directly (avoids gitleaks-action@v2 Node 20 / GITHUB_TOKEN issues).
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks scan
        run: gitleaks detect --source . --verbose --redact --config .gitleaks.toml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck scripts/*.sh

  validate-scripts:
    name: Smoke test scripts
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: sample-check.sh dry-run
        run: |
          chmod +x scripts/*.sh
          PROJECT_NAME=NTVBE_master TARGET_NAME=ntv-mv5 \
            ./scripts/sample-check.sh --dry-run
